# SciTE4AutoIt3 - Modern Dark Theme
# VS Code-inspired colors

font.base=font:Consolas,size:11
font.monospace=font:Consolas,size:11
tabbar.multiline=1
toolbar.visible=1
statusbar.visible=1
line.margin.visible=1
wrap=0
default.file.ext=.au3

style.*.32=$(font.base),fore:#D4D4D4,back:#1E1E1E
style.*.33=fore:#858585,back:#1E1E1E
style.*.34=fore:#FFD700,bold
style.*.35=fore:#F44747,bold
style.*.36=fore:#D4D4D4
style.*.37=fore:#404040

caret.fore=#FFFFFF
caret.line.back=#2A2D2E
caret.line.back.alpha=256
selection.back=#264F78
selection.alpha=256
whitespace.fore=#555555
whitespace.back=#1E1E1E
fold.margin.colour=#252526
fold.margin.highlight.colour=#252526

# AutoIt syntax
style.au3.32=$(font.base),fore:#D4D4D4,back:#1E1E1E
style.au3.0=fore:#D4D4D4,back:#1E1E1E
style.au3.1=fore:#6A9955,italics
style.au3.2=fore:#6A9955,italics
style.au3.3=fore:#B5CEA8
style.au3.4=fore:#DCDCAA
style.au3.5=fore:#569CD6,bold
style.au3.6=fore:#C586C0
style.au3.7=fore:#CE9178
style.au3.8=fore:#D4D4D4
style.au3.9=fore:#9CDCFE
style.au3.10=fore:#D7BA7D
style.au3.11=fore:#C586C0
style.au3.12=fore:#4EC9B0
style.au3.13=fore:#DCDCAA
style.au3.14=fore:#4EC9B0
style.au3.15=fore:#DCDCAA
style.au3.16=fore:#D4D4D4
style.au3.38=fore:#D4D4D4,back:#1E1E1E
style.au3.34=fore:#FFD700,bold
style.au3.35=fore:#F44747,bold

# Output pane
style.errorlist.32=$(font.base),fore:#D4D4D4,back:#1E1E1E
style.errorlist.0=fore:#D4D4D4
style.errorlist.1=fore:#F44747
style.errorlist.2=fore:#4EC9B0
style.errorlist.4=fore:#D4D4D4

# Plain text / properties
style.null.32=$(font.base),fore:#D4D4D4,back:#1E1E1E
style.null.0=fore:#D4D4D4,back:#1E1E1E
style.props.32=$(font.base),fore:#D4D4D4,back:#1E1E1E
style.props.0=fore:#D4D4D4
style.props.1=fore:#6A9955
style.props.2=fore:#CE9178
style.props.3=fore:#D4D4D4
style.props.4=fore:#C586C0
style.props.5=fore:#9CDCFE
